version: 2
updates:
  # Minor and patch updates arrive together in one PR; each major update gets its own.
  # The fuzz crate has its own lockfile, so it is listed separately.
  - package-ecosystem: cargo
    directories: [/, /crates/fuzz]
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
