name: Fuzzing (daily)

on:
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Total fuzzing time in seconds
        default: "1800"

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event.inputs.seconds || '1800' }}
          mode: batch
          sanitizer: address
          output-sarif: true
