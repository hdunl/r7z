name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # Fail the build rather than ship programs without their icon and version information.
  R7Z_REQUIRE_RESOURCES: "1"

jobs:
  release:
    runs-on: windows-latest
    # The Azure signing credential trusts only this environment, which only v* tags can use.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test
        run: cargo test --release --workspace --locked
        env:
          CARGO_TARGET_DIR: target/ci
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the programs
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: hdunl
          certificate-profile-name: r7z-release
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: r7z
          description-url: https://github.com/hdunl/r7z
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          files: |
            ${{ github.workspace }}\target\release\r7z.exe
            ${{ github.workspace }}\target\release\r7z-gui.exe
            ${{ github.workspace }}\target\release\r7z_shell.dll

      - name: Build the Windows 11 menu package
        shell: pwsh
        env:
          PUBLISHER: ${{ secrets.R7Z_CERT_SUBJECT }}
        run: scripts/make_msix.ps1 -Version ("${{ github.ref_name }}".TrimStart("v")) -Publisher $env:PUBLISHER -Out target/release/r7z-shell.msix

      - name: Sign the Windows 11 menu package
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: hdunl
          certificate-profile-name: r7z-release
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: r7z
          description-url: https://github.com/hdunl/r7z
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          files: ${{ github.workspace }}\target\release\r7z-shell.msix

      - name: Check the signatures
        shell: pwsh
        env:
          SUBJECT: ${{ secrets.R7Z_CERT_SUBJECT }}
        run: |
          # Compare the subject's parts, not their order or spacing.
          function Parts($dn) { ($dn -split ',\s*' | ForEach-Object { $_.Trim() } | Sort-Object) -join '|' }
          foreach ($f in "r7z.exe", "r7z-gui.exe", "r7z_shell.dll", "r7z-shell.msix") {
            $sig = Get-AuthenticodeSignature "target/release/$f"
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed: $($sig.StatusMessage)" }
            if ((Parts $sig.SignerCertificate.Subject) -ne (Parts $env:SUBJECT)) { throw "$f is signed by an unexpected certificate" }
            if (-not $sig.TimeStamperCertificate) { throw "$f has no timestamp" }
            Write-Output "${f}: signed and timestamped"
          }

      - name: Package and sign
        env:
          R7Z_UPDATE_KEY: ${{ secrets.R7Z_UPDATE_KEY }}
        run: |
          pip install "cryptography==46.0.3"
          python scripts/package_release.py "${{ github.ref_name }}" dist

      - name: Check the release the way installed copies will
        run: cargo test --release -p r7z-gui --locked -- --ignored packaged_release
        env:
          R7Z_RELEASE_DIR: ${{ github.workspace }}/dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            target/release/r7z.exe
            target/release/r7z-gui.exe
            target/release/r7z_shell.dll
            target/release/r7z-shell.msix

      - name: Attach the provenance to the release
        # The Sigstore bundle verifies offline (`gh attestation verify --bundle`); the
        # .intoto.jsonl holds the same signed SLSA provenance as a DSSE envelope.
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "$BUNDLE" "dist/r7z-$version.sigstore.json"
          python -c "import json, sys; print(json.dumps(json.load(open(sys.argv[1]))['dsseEnvelope'], separators=(',', ':')))" "$BUNDLE" > "dist/r7z-$version.intoto.jsonl"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "r7z ${tag#v}" \
            --notes-file "docs/releases/$tag.md" \
            --verify-tag
