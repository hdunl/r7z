name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # Fail the build rather than ship programs without their icon and version information.
  R7Z_REQUIRE_RESOURCES: "1"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test
        run: cargo test --release --workspace --locked
        env:
          CARGO_TARGET_DIR: target/ci
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Package and sign
        env:
          R7Z_UPDATE_KEY: ${{ secrets.R7Z_UPDATE_KEY }}
        run: |
          pip install "cryptography==46.0.3"
          python scripts/package_release.py "${{ github.ref_name }}" dist

      - name: Check the release the way installed copies will
        run: cargo test --release -p r7z-gui --locked -- --ignored packaged_release
        env:
          R7Z_RELEASE_DIR: ${{ github.workspace }}/dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            target/release/r7z.exe
            target/release/r7z-gui.exe
            target/release/r7z_shell.dll

      - name: Attach the provenance to the release
        # The Sigstore bundle verifies offline (`gh attestation verify --bundle`); the
        # .intoto.jsonl holds the same signed SLSA provenance as a DSSE envelope.
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "$BUNDLE" "dist/r7z-$version.sigstore.json"
          python -c "import json, sys; print(json.dumps(json.load(open(sys.argv[1]))['dsseEnvelope'], separators=(',', ':')))" "$BUNDLE" > "dist/r7z-$version.intoto.jsonl"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "r7z ${tag#v}" \
            --notes-file "docs/releases/$tag.md" \
            --verify-tag
