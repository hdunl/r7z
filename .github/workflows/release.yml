name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.87.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test
        run: cargo test --release --workspace --locked
        env:
          CARGO_TARGET_DIR: target/ci
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Package and sign
        env:
          R7Z_UPDATE_KEY: ${{ secrets.R7Z_UPDATE_KEY }}
        run: |
          pip install "cryptography==46.0.3"
          python scripts/package_release.py "${{ github.ref_name }}" dist

      - name: Check the release the way installed copies will
        run: cargo test --release -p r7z-gui --locked -- --ignored packaged_release
        env:
          R7Z_RELEASE_DIR: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.zip
            target/release/r7z.exe
            target/release/r7z-gui.exe

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "r7z ${tag#v}" \
            --notes-file "docs/releases/$tag.md" \
            --verify-tag
