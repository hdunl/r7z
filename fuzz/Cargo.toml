[package]
name = "r7z-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
r7z = { path = ".." }

# Kept out of the main workspace; built with `cargo fuzz`.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recover"
path = "fuzz_targets/recover.rs"
test = false
doc = false
bench = false
