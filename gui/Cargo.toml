[package]
name = "r7z-gui"
version = "0.1.9"
edition = "2021"
rust-version = "1.95"
description = "Desktop file manager for r7z archives"
license = "Apache-2.0"
repository = "https://github.com/hdunl/r7z"

[[bin]]
name = "r7z-gui"
path = "src/main.rs"

[features]
# The Microsoft Store build: the Store installs and updates r7z and its package adds the
# Explorer menu, so the app's own updater, installer and menu settings are left out.
store = []

[dependencies]
r7z = { path = ".." }
eframe = { version = "0.37", default-features = false, features = ["glow"] }
egui_extras = { version = "0.37", default-features = false }
rfd = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
crc32fast = "1.5"
raw-window-handle = "0.6"
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
ed25519-dalek = { version = "3", default-features = false }

# On Windows the interface uses the system's fonts (see theme::install_fonts); elsewhere
# egui's own fonts are built in.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }
